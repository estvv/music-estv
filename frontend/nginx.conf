# Rate-limit zones keyed on the forwarded client IP: this container is only
# reachable through Caddy, which sets X-Forwarded-For. Locally (port 8094, no
# Caddy) the header is empty and every request shares one bucket, fine for dev.
# The API zone is generous: autocomplete fires a request per pause in typing.
limit_req_zone   $http_x_forwarded_for  zone=api:10m    rate=240r/m;
limit_req_zone   $http_x_forwarded_for  zone=assets:10m rate=240r/m;
limit_conn_zone  $http_x_forwarded_for  zone=conns:10m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # JSON bodies only, and small ones.
    client_max_body_size 16k;
    client_body_timeout  10s;
    client_header_timeout 10s;
    send_timeout 30s;

    limit_conn conns 20;

    server_tokens off;

    # Covers come from Deezer/Spotify CDNs (playlist art, profile pictures, which
    # Spotify may serve from Facebook for Facebook-linked accounts); audio is served by our own API and
    # decoded in-page (blob:). The Spotify Web Playback SDK (party host screen)
    # needs its script, its iframe and the Spotify API.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://sdk.scdn.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://cdn-images.dzcdn.net https://e-cdns-images.dzcdn.net https://i.scdn.co https://mosaic.scdn.co https://image-cdn-ak.spotifycdn.com https://image-cdn-fa.spotifycdn.com https://platform-lookaside.fbsbx.com; media-src 'self' blob:; connect-src 'self' https://api.spotify.com wss:; frame-src https://sdk.scdn.co; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location / {
        limit_req zone=assets burst=60 nodelay;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        limit_req zone=assets burst=120 nodelay;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;

        proxy_pass http://music-backend-estv:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        # Syncing a source or resolving a personal daily can call Deezer/Spotify
        # several times in one request.
        proxy_read_timeout 30s;
        proxy_buffering on;
    }

    # Profile picture upload: the one request bigger than 16k (the browser
    # resizes the image first; the API caps it at 300 KB).
    location = /api/auth/avatar {
        limit_req zone=api burst=10 nodelay;
        client_max_body_size 320k;

        proxy_pass http://music-backend-estv:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Party rooms. Long read timeout: the server pings every 30 s.
    location = /ws {
        proxy_pass http://music-backend-estv:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location = /health {
        proxy_pass http://music-backend-estv:8080;
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
}
